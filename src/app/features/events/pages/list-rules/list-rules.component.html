<section class="flex flex-col w-full">
  <header class="flex justify-center border-b-2 border-b-stone-200 h-14">
    <div class="flex justify-between app-wrapper items-center gap-4">
      <h1 class="flex-1 text-2xl font-bold">
        Listado de Reglas
      </h1>
      
      <button pButton [raised]="true" pTooltip="Nueva regla" (click)="showDialog()" class="shrink-0">
        <i class="pi pi-file-plus"></i>
      </button>
    </div>
  </header>

  <p-dataview #dv [value]="rules()" styleClass="full-w">
    <ng-template #list let-rules class="flex">
      <div class="app-wrapper justify-self-center pt-4">
        @for (rule of rules; track rule.id) {
        <div class="flex items-center gap-4 min-h-12 border border-stone-200 p-2">
          <label
            [for]="'enabled-' + rule.id"
            class="flex flex-1 min-w-0 items-center gap-4 cursor-pointer"
          >
            <p-checkbox
                [inputId]="'enabled-' + rule.id"
                [binary]="true"
                [ngModel]="rule.enabled"
                [pTooltip]="rule.enabled ? 'Clic para deshabilitar regla' : 'Clic para habilitar regla'"
                (ngModelChange)="cambiarEstadoRegla($event, rule.id)"
                class="shrink-0"
            />

            <div class="flex flex-col flex-1">
              <span class="font-bold text-smo">{{ rule.nombre }}</span>
              <div>
                <p-tag [value]="rule.disparador.nombre" />
              </div>
            </div>
          </label>

          <div class="flex shrink-0 gap-2">
            <button
                pButton
                severity="secondary"
                pTooltip="Editar regla"
                [rounded]="true"
                [outlined]="true"
                (click)="abrirFormulario(rule)"
            >
              <i class="pi pi-file-edit"></i>
            </button>
            <button
                pButton [rounded]="true"
                type="button"
                severity="danger"
                pTooltip="Eliminar regla"
                aria-label="Eliminar regla"
                [outlined]="true"
                (click)="confirmarEliminacion($event, rule)"
            >
              <i class="pi pi-times"></i>
            </button>
          </div>
        </div>
        }
      </div>
    </ng-template>
    <ng-template #emptymessage>
      <div class="app-wrapper justify-self-center pt-4 flex flex-col items-center">
        <span class="font-bold">No hay reglas establecidas.</span>
        <div>
          <span>Crear nueva regla </span>
          <button pButton [raised]="true" pTooltip="Nueva regla" (click)="showDialog()" class="shrink-0">
            <i class="pi pi-file-plus"></i>
          </button>
        </div>
      </div>
    </ng-template>
  </p-dataview>

</section>

<p-confirmpopup #deletePopup appendTo="body">
  <ng-template #headless let-confirmation>
      <div class="rounded p-2 flex flex-col gap-2">
          <span class="text-sm">Mensaje de confirmación</span>
          <div class="flex items-center justify-end gap-2">
            <button
              pButton
              type="button"
              severity="secondary"
              [outlined]="true"
              (click)="deletePopup.onReject()"
            >
              Cancelar
            </button>

            <button
              pButton
              type="button"
              severity="danger"
              (click)="deletePopup.onAccept()"
            >
              Eliminar
            </button>
          </div>
      </div>
  </ng-template>
</p-confirmpopup>

<p-dialog
  [modal]="true"
  [header]="ruleSelected ? 'Edición de Regla' : 'Creando nueva regla'"
  [style]="{ width: '50rem' }"
  [(visible)]="visible"
>
  @if (visible) {
  <app-rule-form />
  }
</p-dialog>
